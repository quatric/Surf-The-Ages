<p><font face="Arial, Helvetica, sans-serif"><b>Fauves,</b><i> fohvz</i>, were 

  a group of French artists who painted in a style that emphasized intense color 

  and rapid, vigorous brushstrokes. Fauvism flourished from 1905 to 1907. Henri 

  Matisse led the movement, and members included Andre Derain, Raoul Dufy, and 

  Maurice de Vlaminck.</font></p>
