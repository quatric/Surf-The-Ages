<P><b>spinning </b> 

<P> In most homes, women have the responsibility for making clothes, and they 

  spend many hours at this task. They spin linen from flax and wool yarn from 

  the fleece of sheep. They weave these materials into cloth to be made into clothing. 

  They make dye from nuts, berries, roots, and bark.</P>
