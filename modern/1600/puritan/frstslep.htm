<P><b>sleep</b>

<P>The Latham family sleeps on mattresses stuffed with straw or cornhusks. Their 

  mattresses lie on a wooden frame strung with rope several feet off the floor. 

  Elizabeth's younger sister and brothers sleep on movable beds called trundle 

  beds, which are pulled out at night. </P>
