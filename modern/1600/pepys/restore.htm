<p><b><font face="Times New Roman, Times, serif" size="3" color="#660000">Restoration</font> </b></p>

<p><font face="Times New Roman, Times, serif" size="3">The Restoration was the period following the reestablishment of royal rule in England in 1660. After the overthrow and beheading of King Charles I in 1649, England was governed by a committee of Parliament and then by the dictator Oliver Cromwell.</font></p>
