<title>Common Laborers</title>

</head>



<body bgcolor="#AAB9B1">



<p><b>Common laborers</b> (that is, carters, ploughmen, oxherds, cowherds, shepherds,

swineherds, dairymen, and all people attending to husbandry) may not wear anything but

inexpensive woolen cloth of gray or white. They are further commanded not to eat or drink

excessively.</p>
