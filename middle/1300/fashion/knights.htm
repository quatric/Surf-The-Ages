<body bgcolor="#AAB9B1">



<p><b>Knights </b>may not wear ermine, cloth made of gold threads, or garments decorated

with precious stones. However, their wives may use precious stones on their headdresses.

Knights and ladies with an income above a certain level, as designated by the king, may

wear anything they please except ermine.</p>
