<title>Squires and Merchants</title>

</head>



<body bgcolor="#AAB9B1">



<p><b>Squires and merchants</b> may not wear silk, cloth made of gold or silver threads,

harnesses of gold or silver, precious stones, or any kind of fur. Their wives must not

wear any trimmings on their garments.</p>
