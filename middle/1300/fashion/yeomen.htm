<title>Yeomen and Craftsmen</title>

</head>



<body bgcolor="#AAB9B1">



<p><b>Yeomen and craftsmen</b> may not wear silk, precious stones, cloth made of gold or

silver threads, or embroidered clothing, nor any knives, buttons, or jewelry of gold or

silver. Their wives must not wear veils of silk, nor may they wear any fur except lamb,

rabbit, cat, and fox.</p>
