<title>No one of any class</title>

</head>



<body bgcolor="#AAB9B1">



<p><b>No one, of any class</b>, shall indulge in fraud by wearing, with intent to deceive,

any false hair, long hairpieces, or curls. However, any woman whose own hair is obviously

inadequate may wear braids of flax, wool, cotton, or silk attached to her own hair, to

correct her deficiency.</p>
