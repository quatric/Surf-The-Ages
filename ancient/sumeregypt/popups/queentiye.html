name="queentiye"></a>Queen Tiye</b></font></p>
<p><font face="Verdana, Arial, Helvetica, sans-serif">The daughter of an officer 
  in Egypt's chariot division, Tiye became the chief queen of Amenhotep III and 
  the mother of Akhenaten. She died in or shortly after the 14th year of Akhenaten's 
  reign. </font></p>
