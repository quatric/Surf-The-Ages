<p><font face="Verdana, Arial, Helvetica, sans-serif"><b><a name="osiris"></a>Ostracon</b> 
  </font></p>
<p><font face="Verdana, Arial, Helvetica, sans-serif">Papyrus, a writing 
  material developed in Egypt from plant fibers, was so time-consuming to produce 
  that it was generally used only for official documents and religious texts. 
  Everyday writing was done on flat pieces of pottery or limestone called ostraca, 
  ostracon in the singular.</font></p>
