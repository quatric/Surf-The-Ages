<p><font face="Verdana, Arial, Helvetica, sans-serif">Thutmose, Akhenaten's master 
  sculptor, is often credited with creating a bust of Nefertiti that is one of 
  the most famous pieces of ancient Egyptian art. German excavators found the 
  bust in the ruins of his workshop in 1912.</font></p>
