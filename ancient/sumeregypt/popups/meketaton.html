<p><font face="Verdana, Arial, Helvetica, sans-serif"><b><a
name="meketaton"></a>Meketaton</b></font></p>
<p><font face="Verdana, Arial, Helvetica, sans-serif">The second daughter of Akhenaten 
  and Nefertiti, Meketaton died in about the 14th year of her father's reign when 
  barely a teenager. She was buried in a side chamber of the Royal Tomb at Akhetaten. 
  Scenes on the walls there suggest that she died giving birth. </font></p>
