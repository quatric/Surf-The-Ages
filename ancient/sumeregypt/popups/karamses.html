<p><font face="Verdana, Arial, Helvetica, sans-serif"><b><a name="karamses">Ka</a></b></font></p>
<p><font face="Verdana, Arial, Helvetica, sans-serif">In ancient Egyptian theology, 
  the Ka was a spirit and a "double" for the person who inhabited the body during 
  life. Although the Ka left the body in death, it returned after proper embalming 
  and burial. </font></p>
