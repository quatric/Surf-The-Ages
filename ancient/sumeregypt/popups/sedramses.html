<p><font face="Verdana, Arial, Helvetica, sans-serif">A pharaoh usually held his 
  first sed festival, or royal jubilee, in the 30th year of his reign and then 
  every few years afterward. The festival reaffirmed the pharaoh's authority and 
  renewed his powers. Ramses II held an unprecedented 14 sed festivals.</font></p>
