name="nubiaramses">Nubia</a></b></font></p>
<p><font face="Verdana, Arial, Helvetica, sans-serif">A region of ancient Africa, 
  Nubia covered part of what is now Sudan. The Nubians were controlled by Egyptian 
  rulers at times from about 2000 to 1000 B.C. The Egyptians regarded Nubia as 
  a source of gold and as a trading center for cattle, ivory, and slaves. </font></p>
