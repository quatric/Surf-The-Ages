<p><font face="Verdana, Arial, Helvetica, sans-serif" size="2"><b><a name="Poppaeathelast"></a>Poppaea</b></font></p>
<p><font face="Verdana, Arial, Helvetica, sans-serif" size="2">The last name of 
  one of Pompeii's richest families. Emperor Nero married the beautiful Sabina 
  Poppaea, a native of Pompeii, in A.D. 62. Sabina, who was accused of engineering 
  the murder of Nero's mother and his tutor, died in A.D. 65, kicked to death 
  by her husband. </font> </p>
