<p><font face="Verdana, Arial, Helvetica, sans-serif">The Greeks named seven planets. 
  The Sun and moon were set apart as the "greater" planets. Mercury, Venus, Mars, 
  Jupiter, and Saturn were the "lesser" planets. (Earth was not a planet, but 
  the center of the universe.) </font> </p>
