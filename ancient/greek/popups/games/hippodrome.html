<p><font face="Verdana, Arial, Helvetica, sans-serif">An ancient curved arena 
  for horse and chariot races first designed and built by the Greeks. The seats 
  surrounded a long race course, and curved around one end of it. A wall in the 
  center divided the course. It was usually from 600 to 800 feet (180 to 240 meters) 
  long. </font> </p>
