<p><font face="Verdana, Arial, Helvetica, sans-serif">Beginning in about 300 B.C., 
  the ancient Greeks figured time using the Olympiad, the period of four years 
  that elapsed between two successive celebrations of the Olympic Games. All events 
  were dated from 776 B.C., the start of the first known Olympiad. </font></p>
