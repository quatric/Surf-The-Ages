<p><font face="Verdana, Arial, Helvetica, sans-serif">Zeus was the ruler of the 
  gods in Greek mythology. Zeus was a sky and weather god, especially associated 
  with rain, thunder, and lightning. The Greeks believed he was all-knowing and 
  all-seeing. The Greeks considered Zeus a father figure and a protector, especially 
  of guests and strangers. </font> </p>
