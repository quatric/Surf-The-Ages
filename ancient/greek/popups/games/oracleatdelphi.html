<p><font face="Verdana, Arial, Helvetica, sans-serif">Oracle at Delphi was the 
  most important of all the ancient Greek shrines where people came to seek advice 
  from prophets or prophetesses believed to have special powers to speak on behalf 
  of a god. The oracle at Delphi was dedicated to the god Apollo. </font></p>
