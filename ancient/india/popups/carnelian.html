<p><font face="Verdana, Arial, Helvetica, sans-serif"><b><a
name="carnelian"></a>carnelian</b></font></p>
<p><font face="Verdana, Arial, Helvetica, sans-serif">A gem made from cut and 
  polished red or reddish-brown quartz. The carnelian was one of the first stones 
  to be used as a decoration. People of ancient times believed the carnelian had 
  special powers that would protect its wearer from weapons and evil spirits.
