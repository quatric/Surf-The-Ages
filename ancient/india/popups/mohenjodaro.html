<p><font face="Verdana, Arial, Helvetica, sans-serif"><b><a
name="mohenjodaro"></a>Mohenjo-Daro.</b> </font></p>
<p><font face="Verdana, Arial, Helvetica, sans-serif">The name the ancient residents 
  of Mohenjo-Daro used for their city remains unknown. This ancient city covered 
  a site in what is now Pakistan and was named for a nearby village. Mohenjo-Daro 
  means "the mound of the dead" in Sindhi, a language spoken in Pakistan. </font> 
</p>
