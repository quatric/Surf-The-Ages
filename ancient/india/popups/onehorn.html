<p><font face="Verdana, Arial, Helvetica, sans-serif">Images of a one-horned creature, 
  which may have represented a mythical unicorn, were common in the Indus Valley. 
  The curved horn of the Indus Valley unicorn does not protrude from the center 
  of its forehead but from back of the head. </font> </p>
