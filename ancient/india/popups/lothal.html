name="lothal"></a>Lothal</b></font></p>
<p><font face="Verdana, Arial, Helvetica, sans-serif" size="2">A major Indus Valley 
  port near the coast of the Arabian Sea, Lothal had a 700-foot dock built of 
  an estimated one million bricks as well as huge granaries and factories for 
  making beads. It lay about 450 miles (720 kilometers) southeast of Mohenjo-Daro.
